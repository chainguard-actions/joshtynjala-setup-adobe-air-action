name: Test AIR SDK setup fails without license acceptance
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-air
        uses: .
        with:
          air-version: "50.0"
          accept-license: ""
        continue-on-error: true
      - name: Assert action failed when license not accepted
        env:
          OUTCOME: ${{ steps.setup-air.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail when accept-license is empty, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when accept-license was not provided"
