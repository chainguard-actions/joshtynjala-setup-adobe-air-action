name: Test Adobe AIR SDK setup with invalid version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-air
        name: Setup Adobe AIR SDK with nonexistent version
        uses: .
        with:
          air-version: "0.0.0"
          accept-license: "true"
        continue-on-error: true
      - name: Assert action failed due to invalid version
        env:
          OUTCOME: ${{ steps.setup-air.outcome }}
        run: |
          echo "Step outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for nonexistent AIR version, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed for nonexistent AIR version"
