name: Test basic AIR SDK setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        with:
          air-version: "50.2"
          accept-license: "true"
      - name: Assert AIR_HOME is set
        env:
          AIR_HOME: ${{ env.AIR_HOME }}
        run: |
          echo "AIR_HOME: $AIR_HOME"
          if [ -z "$AIR_HOME" ]; then
            echo "FAIL: AIR_HOME environment variable is not set"
            exit 1
          fi
          echo "PASS: AIR_HOME is set to $AIR_HOME"
      - name: Assert AIR_HOME directory exists
        env:
          AIR_HOME: ${{ env.AIR_HOME }}
        run: |
          echo "Checking AIR_HOME directory: $AIR_HOME"
          if [ ! -d "$AIR_HOME" ]; then
            echo "FAIL: AIR_HOME directory does not exist: $AIR_HOME"
            exit 1
          fi
          echo "PASS: AIR_HOME directory exists"
      - name: Assert adt is on PATH
        run: |
          echo "Checking for adt in PATH..."
          if ! command -v adt >/dev/null 2>&1; then
            echo "FAIL: adt command not found in PATH"
            exit 1
          fi
          echo "PASS: adt found at $(command -v adt)"
