name: Test basic Adobe AIR SDK setup
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-air
        name: Setup Adobe AIR SDK
        uses: .
        with:
          air-version: "50.2"
          accept-license: "true"
      - name: Assert AIR_HOME is set
        run: |
          echo "AIR_HOME: $AIR_HOME"
          if [ -z "$AIR_HOME" ]; then
            echo "FAIL: AIR_HOME environment variable is not set"
            exit 1
          fi
          echo "PASS: AIR_HOME is set to $AIR_HOME"
      - name: Assert AIR SDK bin directory exists
        run: |
          echo "Checking AIR SDK bin directory..."
          if [ ! -d "$AIR_HOME/bin" ]; then
            echo "FAIL: AIR SDK bin directory not found at $AIR_HOME/bin"
            exit 1
          fi
          echo "PASS: AIR SDK bin directory exists at $AIR_HOME/bin"
      - name: Assert adt is on PATH
        run: |
          echo "Checking for adt on PATH..."
          if ! command -v adt &> /dev/null; then
            echo "FAIL: adt command not found on PATH"
            exit 1
          fi
          echo "PASS: adt found at $(which adt)"
