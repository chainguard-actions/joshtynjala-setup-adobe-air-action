name: Test AIR SDK setup with license-base64
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Create a fake base64-encoded license
        id: make-license
        run: |
          # Create a fake license file content and encode it as base64
          FAKE_LICENSE="FAKE_LICENSE_CONTENT_FOR_TESTING"
          ENCODED=$(echo -n "$FAKE_LICENSE" | base64)
          echo "encoded=$ENCODED" >> "$GITHUB_OUTPUT"
      - id: action
        uses: .
        with:
          air-version: "50.2"
          accept-license: "true"
          license-base64: ${{ steps.make-license.outputs.encoded }}
      - name: Assert license file was written
        run: |
          LICENSE_PATH="$HOME/.airsdk/adt.lic"
          echo "Checking for license file at: $LICENSE_PATH"
          if [ ! -f "$LICENSE_PATH" ]; then
            echo "FAIL: license file was not written to $LICENSE_PATH"
            exit 1
          fi
          echo "PASS: license file exists at $LICENSE_PATH"
      - name: Assert license file content is correct
        run: |
          LICENSE_PATH="$HOME/.airsdk/adt.lic"
          CONTENT=$(cat "$LICENSE_PATH")
          EXPECTED="FAKE_LICENSE_CONTENT_FOR_TESTING"
          echo "License file content: $CONTENT"
          if [ "$CONTENT" != "$EXPECTED" ]; then
            echo "FAIL: license file content does not match expected"
            echo "Expected: $EXPECTED"
            echo "Got: $CONTENT"
            exit 1
          fi
          echo "PASS: license file content matches expected"
      - name: Assert AIR_HOME is set
        env:
          AIR_HOME: ${{ env.AIR_HOME }}
        run: |
          echo "AIR_HOME: $AIR_HOME"
          if [ -z "$AIR_HOME" ]; then
            echo "FAIL: AIR_HOME environment variable is not set"
            exit 1
          fi
          echo "PASS: AIR_HOME is set to $AIR_HOME"
