name: Test AIR SDK setup fails with invalid version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: setup-air
        uses: .
        with:
          air-version: "999.999"
          accept-license: "true"
        continue-on-error: true
      - name: Assert action failed with invalid version
        env:
          OUTCOME: ${{ steps.setup-air.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail with invalid version 999.999, but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: action correctly failed when given an invalid AIR version"
