name: Test AIR SDK install fails with invalid version
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - id: action
        uses: .
        continue-on-error: true
        with:
          air-version: "0.0.0.0"
          accept-license: "true"

      - name: Assert action failed with invalid version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "Action outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: Expected action to fail with invalid AIR version '0.0.0.0', but got outcome: $OUTCOME"
            exit 1
          fi
          echo "PASS: Action correctly failed with invalid AIR version"
