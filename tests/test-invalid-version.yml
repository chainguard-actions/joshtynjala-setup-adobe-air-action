name: Test invalid AIR version fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          air-version: "0.0.0.0"
          accept-license: "true"
      - name: Assert action failed for unknown version
        env:
          OUTCOME: ${{ steps.action.outcome }}
        run: |
          echo "outcome: $OUTCOME"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected action to fail for unknown AIR version '0.0.0.0', but outcome was '$OUTCOME'"
            exit 1
          fi
          echo "PASS: action correctly failed for unknown AIR version"
